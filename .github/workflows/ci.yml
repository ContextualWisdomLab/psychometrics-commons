name: Runtime CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "scripts/check_coverage.py"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/**"
      - "scripts/check_coverage.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psychometrics-commons-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  CARGO_LLVM_COV_VERSION: "0.8.6"

jobs:
  rust-quality:
    name: Format, lint, test, and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Run coverage-contract regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build warning-free documentation
        run: cargo doc --no-deps

  line-coverage:
    name: Production line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain with LLVM tools
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Verify cargo-llvm-cov version
        run: cargo llvm-cov --version | grep -F "$CARGO_LLVM_COV_VERSION"
      - name: Generate line coverage
        run: cargo llvm-cov --json --summary-only --output-path coverage.json
      - name: Enforce complete line coverage
        run: python3 scripts/check_coverage.py coverage.json --kind lines
      - name: Diagnose missing line coverage
        if: failure()
        run: cargo llvm-cov report --show-missing-lines || true

  branch-coverage:
    name: Production branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned nightly with LLVM tools
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo +nightly-2026-08-01 install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Verify cargo-llvm-cov version
        run: cargo +nightly-2026-08-01 llvm-cov --version | grep -F "$CARGO_LLVM_COV_VERSION"
      - name: Generate branch coverage
        run: cargo +nightly-2026-08-01 llvm-cov --branch --json --summary-only --output-path coverage-branches.json
      - name: Enforce complete branch coverage
        run: python3 scripts/check_coverage.py coverage-branches.json --kind branches
      - name: Diagnose missing branch coverage
        if: failure()
        run: cargo +nightly-2026-08-01 llvm-cov report --branch --show-missing-lines || true
