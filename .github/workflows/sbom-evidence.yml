name: SPDX SBOM evidence

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "scripts/validate_spdx_sbom.py"
      - "tests/test_sbom_evidence.py"
      - "tests/test_validate_spdx_sbom.py"
      - ".github/workflows/sbom-evidence.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
      - "scripts/validate_spdx_sbom.py"
      - "tests/test_sbom_evidence.py"
      - "tests/test_validate_spdx_sbom.py"
      - ".github/workflows/sbom-evidence.yml"
  workflow_dispatch:

concurrency:
  group: psychometrics-commons-sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate locked SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact head
        uses: actions/checkout@631c942040754b6e095e929c1677c07e10ed4f87
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify SBOM workflow and validator contracts
        run: |
          python3 tests/test_sbom_evidence.py
          python3 tests/test_validate_spdx_sbom.py
      - name: Generate local SPDX JSON
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.51.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Validate locked dependency coverage
        run: python3 scripts/validate_spdx_sbom.py sbom.spdx.json Cargo.lock
      - name: Record SBOM checksum
        run: sha256sum sbom.spdx.json > sbom.spdx.json.sha256
      - name: Preserve exact SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sbom-spdx-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sbom.spdx.json
            sbom.spdx.json.sha256
          if-no-files-found: error
          retention-days: 14
